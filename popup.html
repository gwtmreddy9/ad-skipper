<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 240px; margin: 0; padding: 14px; background: #111; color: #eee; }
  h1 { font-size: 14px; margin: 0 0 12px; }
  label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
  .stats { background: #1d1d1d; border-radius: 6px; padding: 8px 10px; margin-top: 12px; }
  .stats b { color: #9b7bff; }
</style>
</head>
<body>
  <h1>Ad Skipper</h1>
  <label>Remove ads <input type="checkbox" id="enabled"></label>
  <label>Block ad trackers <input type="checkbox" id="network"></label>
  <label>Log to console <input type="checkbox" id="debug"></label>
  <div class="stats">
    <b id="breaks">0</b> ad breaks removed<br>
    <b id="saved">0</b> min of ads not watched
  </div>
  <script src="popup.js"></script>
</body>
</html>
